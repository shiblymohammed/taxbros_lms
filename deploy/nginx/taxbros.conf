# Nginx site for TAXBROS LMS (Tasks 68-70)
# One domain serves both apps, so the refresh cookie stays same-site:
#   https://DOMAIN/          -> Next.js  (127.0.0.1:3000)
#   https://DOMAIN/api/      -> NestJS   (127.0.0.1:4000)
#   https://DOMAIN/uploads/  -> NestJS   (course cover images)
#
# Install: copy to /etc/nginx/sites-available/taxbros, replace DOMAIN everywhere,
# symlink into sites-enabled, then:  sudo certbot --nginx -d DOMAIN
# Security headers (CSP, HSTS, ...) are set by the apps themselves.

upstream taxbros_web { server 127.0.0.1:3000; keepalive 16; }
upstream taxbros_api { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 3m;   # uploads are limited to 2 MB by the API

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://taxbros_api;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://taxbros_api;
        expires 7d;
    }

    # Hashed build assets never change: cache for a year
    location /_next/static/ {
        proxy_pass http://taxbros_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://taxbros_web;
    }
}
