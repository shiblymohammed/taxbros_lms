services:
  - type: web
    name: taxbros-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pnpm install --no-frozen-lockfile --prod=false && pnpm --filter @taxbros/types build && pnpm --filter api prisma:generate && pnpm --filter api build
    startCommand: NODE_ENV=production pnpm --filter api start:prod
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 15m
      - key: REFRESH_TOKEN_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: SWAGGER_ENABLED
        value: "true"
